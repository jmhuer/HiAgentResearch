project_id: mnist
workdir: .
editable_paths:
  - mnist/requirements.txt
  - mnist/pipeline/model.py
  - mnist/pipeline/train.py
  - mnist/pipeline/train_optuna.py
  - mnist/pipeline/kwta.py
  - mnist/eval/run_eval.py
dependency_files:
  - mnist/requirements.txt
generated_paths:
  - mnist/data/
  - mnist/pipeline/checkpoints/
frozen_paths:
  - .hiagentresearch/eval/
frozen_eval_entrypoint: .hiagentresearch/eval/run_phase1_eval.py
evaluation:
  command_template: "python {frozen_eval_entrypoint} --mnist-root mnist --group-id {group_id} --quick"
  parser: canonical_json_stdout
  success_metrics:
    accuracy:
      min: 0.866
    latency_ms:
      max: 13.0
    tests_passed:
      min: 1
artifact_contract:
  required:
    - metrics.json
    - failure_class.json
    - research_outcome.json
    - run_meta.json
    - stdout.txt
    - stderr.txt
  optional:
    - parsed_eval.json
    - agent_actions.jsonl
    - train_metrics.json
    - experiment_manifest.json
    - experiment_intent.json
    - experiment_plan.md
policy_modes:
  explore: "Try one bounded hypothesis and allow measured regressions with evidence."
  exploit: "Prefer refinements to evidence-backed promising directions."
  reset: "Start a new hypothesis track from a rollback anchor."
github:
  workflow_name: hiagentresearch-research-eval
  remote: origin
  run_lookup_attempts: 30
  run_lookup_sleep_sec: 3
orchestration:
  baseline_ref: main
  execution_waves:
    - [model_architecture, data_augmentation]
    - [optimization_strategy]
    - [hyperparameter_optimization]
dashboard:
  enabled: true
  title: HiAgentResearch
  metrics:
    - accuracy
    - latency_ms
  output_dir: .hiagentresearch/dashboard
agent_tools:
  validation_commands:
    - name: kwta_unit_tests
      command: "python -m pytest -q mnist/pipeline/test_kwta.py"
      description: "Fast code correctness feedback for the model support code."
    - name: quick_train_eval
      command: "python mnist/pipeline/train.py --quick --output /tmp/hiagentresearch_mnist_train_metrics.json && python mnist/eval/run_eval.py --quick --metrics /tmp/hiagentresearch_mnist_train_metrics.json"
      description: "Optional local feedback; GitHub still runs the frozen final eval."
agent_contract:
  guidance_files:
    - hiagentresearch/AGENTS.md
    - hiagentresearch/skills/phase1-experiment-cycle/SKILL.md
  context_paths:
    - mnist/requirements.txt
    - mnist/pipeline/model.py
    - mnist/pipeline/train.py
  supporting_artifacts: []
  research_output_expectations:
    - "Every cycle starts with concrete evidence and a written plan before code edits."
    - "Every cycle applies at least one bounded edit to a configured core implementation file."
    - "Every cycle produces eval artifacts, records whether the experiment improved baseline, and updates tactical intent."
    - "Research branches keep accumulating valid experiments; metric regressions are knowledge, not execution failures."
  retry_policy:
    max_repair_attempts: 1
    max_loops_without_quality_output: 3
research_groups:
  - id: model_architecture
    branch: research/model-architecture
    objective: Improve model architecture while preserving latency budget.
    policy_mode: explore
    lineage:
      mode: baseline
    allowed_paths:
      - mnist/requirements.txt
      - mnist/pipeline/model.py
      - mnist/pipeline/train.py
      - mnist/eval/run_eval.py
  - id: hyperparameter_optimization
    branch: research/hyperparameter-optimization
    objective: Improve training dynamics through hyperparameter exploration.
    policy_mode: explore
    lineage:
      mode: inherit
      inherit_from: optimization_strategy
      anchor_policy: best_commit
      anchor_metric: accuracy
    allowed_paths:
      - mnist/requirements.txt
      - mnist/pipeline/train.py
      - mnist/pipeline/train_optuna.py
  - id: data_augmentation
    branch: research/data-augmentation
    objective: Improve robustness and accuracy using targeted augmentation strategy.
    policy_mode: explore
    lineage:
      mode: baseline
    allowed_paths:
      - mnist/requirements.txt
      - mnist/pipeline/train.py
      - mnist/pipeline/model.py
      - mnist/eval/run_eval.py
  - id: optimization_strategy
    branch: research/optimization-strategy
    objective: Improve optimization strategy and training efficiency tradeoffs.
    policy_mode: exploit
    lineage:
      mode: inherit
      inherit_from: model_architecture
      anchor_policy: best_commit
      anchor_metric: accuracy
    allowed_paths:
      - mnist/requirements.txt
      - mnist/pipeline/train.py
      - mnist/pipeline/train_optuna.py
      - mnist/pipeline/kwta.py
