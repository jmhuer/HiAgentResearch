name: hiagentresearch-dashboard

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["hiagentresearch-research-eval"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: hiagentresearch-dashboard
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # Rebuild after any successful eval — including the baseline on main, which is now
    # a first-class L0 run that should publish as the initial top commit. The
    # artifact_count==0 guard below still prevents an empty deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'
      )
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Build the dashboard from the same config the run used (see the eval workflow).
      HIAGENTRESEARCH_CONFIG: ${{ vars.HIAGENTRESEARCH_CONFIG || 'configs/standard.yaml' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python - <<'PY'
          import subprocess
          import sys
          from hiagentresearch.src.core.config import load_config

          for dependency_file in load_config().dependency_file_paths():
              subprocess.run([sys.executable, "-m", "pip", "install", "-r", str(dependency_file)], check=True)
          PY

      - name: Check dashboard config
        id: dashboard_config
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from hiagentresearch.src.core.config import load_config

          config = load_config()
          print(f"enabled={str(config.dashboard.enabled).lower()}")
          print(f"output_dir={config.dashboard.output_dir}")
          PY

      - name: Collect research artifacts
        id: collect_artifacts
        if: steps.dashboard_config.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dashboard-artifacts
          git fetch --no-tags --prune origin '+refs/heads/research/*:refs/remotes/origin/research/*'
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import subprocess
          import sys
          from pathlib import Path

          from hiagentresearch.src.core.config import load_config
          from hiagentresearch.src.github.session import resolve_github_session_started_at
          from hiagentresearch.src.orchestration.session import timestamp_at_or_after

          config = load_config()
          workflow = config.github.workflow_name
          baseline_ref = config.orchestration.baseline_ref
          # Collect the baseline (main) run too — it carries the frozen L0 that should
          # show before any research loop has run.
          collectible_branches = {group.branch for group in config.research_groups} | {baseline_ref}
          session_started_at = resolve_github_session_started_at(config)
          if not session_started_at:
              print("artifact_count=0")
              raise SystemExit(0)
          result = subprocess.run(
              [
                  "gh",
                  "run",
                  "list",
                  "--workflow",
                  workflow,
                  "--status",
                  "completed",
                  "--limit",
                  "100",
                  "--json",
                  "databaseId,headBranch,headSha,createdAt,updatedAt",
              ],
              check=True,
              capture_output=True,
              text=True,
          )
          target = Path("dashboard-artifacts")
          for row in json.loads(result.stdout):
              branch = str(row.get("headBranch", ""))
              sha = str(row.get("headSha", ""))
              created_at = str(row.get("createdAt", ""))
              updated_at = str(row.get("updatedAt", ""))
              in_session = True
              if session_started_at:
                  created_ok = bool(created_at and timestamp_at_or_after(created_at, session_started_at))
                  updated_ok = bool(updated_at and timestamp_at_or_after(updated_at, session_started_at))
                  # Keep runs that were CREATED in-session or that FINISHED/updated in-session.
                  # This avoids dropping long-running evals that started right before the cutoff.
                  in_session = created_ok or updated_ok
              if not in_session:
                  continue
              if branch not in collectible_branches or not sha:
                  continue
              live_ref = f"origin/{branch}"
              is_current_branch_history = subprocess.run(
                  ["git", "merge-base", "--is-ancestor", sha, live_ref],
                  check=False,
              ).returncode == 0
              if not is_current_branch_history:
                  # Fail loud rather than silently shrinking the published view: a
                  # successful in-session run was dropped because its commit is no
                  # longer in branch history (e.g. force-push/rebase).
                  print(
                      f"::warning::dropping run {row.get('databaseId')} on {branch} "
                      f"({sha[:12]}): commit not in {live_ref} history",
                      file=sys.stderr,
                  )
                  continue
              run_id = str(row["databaseId"])
              subprocess.run(
                  [
                      "gh",
                      "run",
                      "download",
                      run_id,
                      "--pattern",
                      "hiagentresearch-*",
                      "--dir",
                      str(target / run_id),
                  ],
                  check=False,
              )
          ingested = sum(1 for _ in target.rglob("metrics.json"))
          print(f"artifact_count={ingested}")
          PY

      - name: Build dashboard
        if: >-
          steps.dashboard_config.outputs.enabled == 'true' &&
          steps.collect_artifacts.outputs.artifact_count != '0'
        run: |
          hiagentresearch dashboard build-from-artifacts \
            --artifact-root dashboard-artifacts \
            --output-dir _site \
            --require-sqlite-assets

      - name: Configure Pages
        if: >-
          steps.dashboard_config.outputs.enabled == 'true' &&
          steps.collect_artifacts.outputs.artifact_count != '0'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: >-
          steps.dashboard_config.outputs.enabled == 'true' &&
          steps.collect_artifacts.outputs.artifact_count != '0'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        if: >-
          steps.dashboard_config.outputs.enabled == 'true' &&
          steps.collect_artifacts.outputs.artifact_count != '0'
        id: deployment
        uses: actions/deploy-pages@v4
