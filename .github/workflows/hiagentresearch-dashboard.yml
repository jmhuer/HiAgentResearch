name: hiagentresearch-dashboard

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["hiagentresearch-research-eval"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: hiagentresearch-dashboard
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Check dashboard config
        id: dashboard_config
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from hiagentresearch.src.core.config import load_config

          config = load_config()
          print(f"enabled={str(config.dashboard.enabled).lower()}")
          print(f"output_dir={config.dashboard.output_dir}")
          PY

      - name: Collect research artifacts
        if: steps.dashboard_config.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dashboard-artifacts
          git fetch --no-tags --prune origin '+refs/heads/research/*:refs/remotes/origin/research/*'
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          from hiagentresearch.src.core.config import load_config

          config = load_config()
          workflow = config.github.workflow_name
          research_branches = {group.branch for group in config.research_groups}
          result = subprocess.run(
              [
                  "gh",
                  "run",
                  "list",
                  "--workflow",
                  workflow,
                  "--status",
                  "completed",
                  "--limit",
                  "100",
                  "--json",
                  "databaseId,headBranch,headSha",
              ],
              check=True,
              capture_output=True,
              text=True,
          )
          target = Path("dashboard-artifacts")
          for row in json.loads(result.stdout):
              branch = str(row.get("headBranch", ""))
              sha = str(row.get("headSha", ""))
              if branch not in research_branches or not sha:
                  continue
              live_ref = f"origin/{branch}"
              is_current_branch_history = subprocess.run(
                  ["git", "merge-base", "--is-ancestor", sha, live_ref],
                  check=False,
              ).returncode == 0
              if not is_current_branch_history:
                  continue
              run_id = str(row["databaseId"])
              subprocess.run(
                  [
                      "gh",
                      "run",
                      "download",
                      run_id,
                      "--pattern",
                      "hiagentresearch-*",
                      "--dir",
                      str(target / run_id),
                  ],
                  check=False,
              )
          PY

      - name: Build dashboard
        if: steps.dashboard_config.outputs.enabled == 'true'
        run: |
          hiagentresearch dashboard build-from-artifacts \
            --artifact-root dashboard-artifacts \
            --output-dir _site \
            --require-sqlite-assets

      - name: Configure Pages
        if: steps.dashboard_config.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.dashboard_config.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        if: steps.dashboard_config.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
