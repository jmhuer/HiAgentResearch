name: hiagentresearch-research-eval

on:
  push:
    branches:
      - "research/**"
  workflow_dispatch:
    inputs:
      group_id:
        description: "Research group id override"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hiagentresearch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate-and-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python - <<'PY'
          import subprocess
          import sys
          from hiagentresearch.src.config import load_config

          for dependency_file in load_config().dependency_file_paths():
              subprocess.run([sys.executable, "-m", "pip", "install", "-r", str(dependency_file)], check=True)
          PY

      - name: Resolve group id from branch
        id: group
        shell: bash
        run: |
          branch="${GITHUB_REF_NAME}"
          input_group="${{ github.event.inputs.group_id }}"
          if [[ -n "$input_group" ]]; then
            gid="$input_group"
          else
            gid="$(python -m hiagentresearch.src.config resolve-group --branch "$branch")"
          fi
          echo "group_id=$gid" >> "$GITHUB_OUTPUT"
          commit_msg="$(git log -1 --pretty=%B)"
          correlation_id="$(python - <<'PY' "$commit_msg" "${{ github.sha }}"
          import re, sys
          msg, sha = sys.argv[1], sys.argv[2]
          match = re.search(r"HiAgentResearch-Run-ID:\s*(\S+)", msg)
          print(match.group(1) if match else sha)
          PY
          )"
          echo "correlation_id=$correlation_id" >> "$GITHUB_OUTPUT"

      - name: Resolve eval command
        id: eval_command
        shell: bash
        run: |
          command="$(python - <<'PY' "${{ steps.group.outputs.group_id }}"
          import sys
          from hiagentresearch.src.config import load_config
          config = load_config()
          group = config.group_by_id(sys.argv[1])
          print(config.format_eval_command(group))
          PY
          )"
          echo "command=$command" >> "$GITHUB_OUTPUT"

      - name: Run phase-1 eval
        id: eval
        shell: bash
        run: |
          set +e
          ${{ steps.eval_command.outputs.command }} > stdout.txt 2> stderr.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Normalize phase-1 artifacts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from hiagentresearch.src.artifact_schema import normalize_eval
          from hiagentresearch.src.quality import classify_research_outcome

          from hiagentresearch.src.config import load_config

          config = load_config()
          group = config.group_by_id("${{ steps.group.outputs.group_id }}")
          parser = (group.evaluation.parser if group.evaluation else config.evaluation.parser)
          stdout = Path("stdout.txt").read_text(encoding="utf-8")
          stderr = Path("stderr.txt").read_text(encoding="utf-8")
          exit_code = int("${{ steps.eval.outputs.exit_code }}")
          normalized = normalize_eval(
              parser=parser,
              stdout=stdout,
              stderr=stderr,
              exit_code=exit_code,
          )
          metrics = normalized.to_metrics()
          if normalized.raw.get("tests_passed") is not None:
              metrics["tests_passed"] = float(normalized.raw["tests_passed"])
          if normalized.raw.get("tests_failed") is not None:
              metrics["tests_failed"] = float(normalized.raw["tests_failed"])
          if normalized.raw.get("duration_sec") is not None:
              metrics["duration_sec"] = float(normalized.raw["duration_sec"])
          eval_config = group.evaluation or config.evaluation
          failure_class = normalized.failure_class
          outcome = classify_research_outcome(
              execution_failure_class=failure_class,
              eval_passed=normalized.passed,
              metrics=metrics,
              expectations=eval_config.success_metrics,
          )
          research_outcome = outcome.to_dict()
          normalized.raw["research_outcome"] = research_outcome["research_outcome"]
          normalized.raw["improved_baseline"] = research_outcome["improved_baseline"]
          Path("metrics.json").write_text(json.dumps(metrics, indent=2), encoding="utf-8")
          Path("failure_class.json").write_text(
              json.dumps({"failure_class": failure_class, "exit_code": exit_code}, indent=2),
              encoding="utf-8",
          )
          Path("research_outcome.json").write_text(json.dumps(research_outcome, indent=2), encoding="utf-8")
          Path("run_meta.json").write_text(
              json.dumps(
                  {
                      "commit_sha": "${{ github.sha }}",
                      "workflow_run_id": "${{ github.run_id }}",
                      "branch": "${{ github.ref_name }}",
                      "group_id": "${{ steps.group.outputs.group_id }}",
                      "run_id": "gh_${{ github.run_id }}",
                      "correlation_id": "${{ steps.group.outputs.correlation_id }}",
                      "parser": parser,
                  },
                  indent=2,
              ),
              encoding="utf-8",
          )
          PY

      - name: Ingest into phase-1 registry
        shell: bash
        run: |
          python -m hiagentresearch.src.gh_ingest \
            --run-id "gh_${{ github.run_id }}" \
            --group-id "${{ steps.group.outputs.group_id }}" \
            --branch "${{ github.ref_name }}" \
            --artifact-dir "."

      - name: Upload observability artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hiagentresearch-${{ github.run_id }}
          path: |
            stdout.txt
            stderr.txt
            metrics.json
            failure_class.json
            research_outcome.json
            run_meta.json
            .hiagentresearch/state/evals.db

      - name: Fail on execution failure
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          failure = json.loads(Path("failure_class.json").read_text(encoding="utf-8"))
          raise SystemExit(0 if failure.get("failure_class") == "none" else 1)
          PY
