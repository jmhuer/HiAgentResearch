project_id: mnist
workdir: mnist
dependency_files:
  - mnist/requirements.txt
evaluation:
  entrypoint: .hiagentresearch/eval/run_phase1_eval.py
  command_template: "python {entrypoint} --workdir {workdir} --group-id {group_id} --quick"
  targets:
    accuracy:
      min: 0.985
    latency_ms:
      max: 13.0
hidden_paths: []
generated_paths:
  - data/
  - src/checkpoints/
policy_modes:
  explore: "Try one bounded hypothesis and allow measured regressions with evidence."
  exploit: "Prefer refinements to evidence-backed promising directions."
github:
  workflow_name: hiagentresearch-research-eval
  remote: origin   # git push + gh --repo target; derived from this remote's URL
  run_lookup_attempts: 30
  run_lookup_sleep_sec: 3
orchestration:
  baseline_ref: main
  execution_waves:
    - [model_architecture, data_augmentation]
    - [optimization_strategy]
    - [hyperparameter_optimization]
    - [polish_code]
    - [merge_best]   # final wave: merge the strongest commit of every lineage
agent:
  model: composer-2.5
  thinking: high   # strongest reasoning mode, applied to every research group
dashboard:
  enabled: false   # CI Pages publish off; build locally with `hiagentresearch dashboard build`
  title: HiAgentResearch
  metrics:
    - accuracy
    - latency_ms
  output_dir: .hiagentresearch/dashboard
agent_contract:
  research_output_expectations:
    - "Every cycle starts with concrete evidence and a written plan before code edits."
    - "Every cycle leaves an auditable trail (planning artifacts, committed manifest, updated tactical intent); the orchestrator runs eval after the edit."
    - "Research branches keep accumulating valid experiments; metric regressions are knowledge, not execution failures."
research_groups:
  - id: model_architecture
    branch: research/model-architecture
    objective: Improve model architecture while preserving latency budget.
    policy_mode: explore
    lineage:
      mode: baseline
  - id: hyperparameter_optimization
    branch: research/hyperparameter-optimization
    objective: Improve training dynamics through hyperparameter exploration.
    policy_mode: explore
    lineage:
      mode: inherit
      inherit_from: optimization_strategy
      inherit_policy: best_commit
      anchor_metric: accuracy
  - id: data_augmentation
    branch: research/data-augmentation
    objective: Improve robustness and accuracy using targeted augmentation strategy.
    policy_mode: explore
    lineage:
      mode: baseline
  - id: optimization_strategy
    branch: research/optimization-strategy
    objective: Improve optimization strategy and training efficiency tradeoffs.
    policy_mode: exploit
    lineage:
      mode: inherit
      inherit_from: model_architecture
      inherit_policy: best_commit
      anchor_metric: accuracy
  - id: polish_code
    branch: research/polish-code
    objective: Improve code quality, structure, and maintainability.
    policy_mode: exploit
    task_kind: engineering
    lineage:
      mode: inherit
      inherit_from: hyperparameter_optimization
      inherit_policy: best_commit      # branch from the BEST hyperparam commit
      top_commit_policy: last_commit   # latest polish run is always the top commit
      anchor_metric: accuracy
  # Cross-lineage merge (build task). Combines the strongest commit of every lineage.
  # Near-zero config: objective, base (inherit_from), and draw_from are auto-resolved
  # after the source lineages finish — the orchestrator ranks the lineage winners,
  # starts from the strongest, and integrates the rest best->worst. Runs in the final
  # execution wave above.
  - id: merge_best
    branch: research/merge-best
    policy_mode: exploit
    task_kind: merge
    lineage:
      mode: inherit                  # base = strongest lineage winner (auto)
      top_commit_policy: best_commit # keeps the star >= base if a merge cycle fails
      anchor_metric: accuracy        # ranks lineages + drives the merge order
